# Prometheus scrape config (anonymised). Targets are reached by container name on the
# internal network, except node-exporter, which runs with host networking.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
